name: CI/CD

on:
  push:
    branches: [developer, master]
  pull_request:
    branches: [developer, master]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./test.db"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Generate Prisma Client (server)
        run: npm run db:generate

      - name: Apply database migrations
        working-directory: apps/server
        run: npx prisma migrate deploy

      - name: Run server tests
        run: npm test --workspace=apps/server

      - name: Run web tests
        run: npm test --workspace=apps/web

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      - name: Build all workspaces
        run: npm run build

  merge-to-main:
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/developer'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Merge developer to main
        run: |
          git config --local user.email "ci@github.com"
          git config --local user.name "GitHub Actions"
          git fetch origin master:master
          git checkout master
          git merge developer --no-edit --allow-unrelated-histories || git reset --hard developer
          git push origin master --force
